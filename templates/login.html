<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Administrator Login • Campus Secure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding: 1.5rem;">
    <div class="section-card" style="width:100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); border-color: rgba(56,189,248,0.3);">
        <div style="text-align:center; margin-bottom: 1.75rem;">
            <div class="brand-shield" style="margin: 0 auto 0.75rem auto; width: 44px; height: 44px; font-size: 1.3rem;">🛡️</div>
            <h1 style="font-size: 1.35rem; font-weight: 800; color: #fff;">SOC ANALYST ACCESS</h1>
            <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem;">Campus Secure Network Defense Platform</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #f87171; padding: 0.65rem; border-radius: 6px; font-size: 0.82rem; margin-bottom: 1.25rem;">
                        {{ msg }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}" style="display:flex; flex-direction:column; gap: 1rem;">
            <div>
                <label for="username" style="display:block; font-size:0.8rem; font-weight:700; color:#94a3b8; margin-bottom:0.35rem;">Admin Username:</label>
                <input type="text" id="username" name="username" required placeholder="admin" style="width:100%;" autofocus>
            </div>

            <div>
                <label for="password" style="display:block; font-size:0.8rem; font-weight:700; color:#94a3b8; margin-bottom:0.35rem;">Password:</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" style="width:100%; padding: 0.45rem 0.75rem; background:#0d1421; border:1px solid #223048; color:#fff; border-radius:6px; font-size:0.84rem;">
            </div>

            <button type="submit" class="btn btn-primary" style="justify-content:center; padding: 0.75rem; margin-top: 0.5rem; font-size: 0.95rem;">
                🔐 Authenticate Session
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.06); text-align: center; font-size: 0.78rem; color: #64748b;">
            Default Credentials: <code class="mono" style="color:#38bdf8;">admin</code> / <code class="mono" style="color:#38bdf8;">admin123</code>
            <div style="margin-top: 0.5rem;">
                <a href="{{ url_for('dashboard') }}" style="color:#94a3b8; text-decoration:none;">&larr; Return to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
